name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8==7.3.0
      - name: Lint
        run: flake8 --max-line-length=100 --ignore=E126,E203,W503,E501 --exclude=.venv,__pycache__,build,dist .
      - name: Syntax check
        run: python -m compileall -q clients config domain stages utils main.py thumbnail.py
